name: Daily Foundational Physics Lecture

on:
  schedule:
    # 8:30 صباحاً بتوقيت القاهرة (UTC+2) يوافق 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر للتجربة

permissions:
  contents: write # صلاحية تحديث ملف CSV وحفظ ملفات .md و .pdf والصور داخل المستودع

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas requests matplotlib

      - name: Install Pandoc, XeLaTeX, and Amiri Arabic Font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-arabic fonts-hosny-amiri

      - name: Run Lecture Generator & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_LIST: ${{ secrets.SUBSCRIBERS_LIST }}
        run: python generate_lecture.py

      - name: Commit and push updated CSV and archived lectures
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "History of Physics - Papers.csv" lectures_md/ lectures_pdf/ lectures_img/
          git commit -m "Archive daily physics lecture with diagram" || exit 0
          git push
