name: Daily Foundational Physics Lecture

on:
  schedule:
    # 6:00 صباحاً بتوقيت مصر (UTC+2) يوافق 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Syntax First
        run: python -m py_compile generate_lecture.py

      - name: Install Python dependencies
        run: pip install pandas requests matplotlib

      - name: Install Pandoc, XeLaTeX, and Amiri Arabic Font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-arabic fonts-hosny-amiri

      - name: Run Lecture Generator & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_LIST: ${{ secrets.SUBSCRIBERS_LIST }}
        run: python generate_lecture.py

      - name: Commit and push updated CSV and archived lectures
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "History of Physics - Papers.csv" lectures_md/ lectures_pdf/ lectures_img/ lectures_html/
          git commit -m "Archive daily physics lecture with diagram and interactive HTML" || exit 0
          git push
